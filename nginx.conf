# Nginx configuration for patrickadrianus.com
# Place this in your nginx sites-available directory (e.g., /etc/nginx/sites-available/patrickadrianus.com)
# Then create a symlink: sudo ln -s /etc/nginx/sites-available/patrickadrianus.com /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name patrickadrianus.com www.patrickadrianus.com;
    
    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name patrickadrianus.com www.patrickadrianus.com;

    # SSL configuration (update paths as needed)
    ssl_certificate /etc/ssl/certs/patrickadrianus.com.crt;
    ssl_certificate_key /etc/ssl/private/patrickadrianus.com.key;
    
    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Document root - points to your deployment path
    # Update this path to match your actual deployment directory
    root /var/www/patrickadrianus.com/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private must-revalidate auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval'" always;

    # Handle static assets with long-term caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|pdf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Handle API routes if you have any (return 404 if not found)
    location /api {
        try_files $uri $uri/ =404;
    }

    # CRITICAL: SPA routing - this handles all routes including /birthday
    # This must be the last location block
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security: deny access to hidden files
    location ~ /\. {
        deny all;
    }
    
    # Deny access to sensitive files
    location ~* \.(env|log|sql|bak)$ {
        deny all;
    }
}

# Birthday subdomain redirect (optional)
server {
    listen 80;
    listen [::]:80;
    server_name birthday.patrickadrianus.com;
    return 301 https://patrickadrianus.com/birthday;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name birthday.patrickadrianus.com;

    # SSL configuration (same as main domain)
    ssl_certificate /etc/ssl/certs/patrickadrianus.com.crt;
    ssl_certificate_key /etc/ssl/private/patrickadrianus.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    return 301 https://patrickadrianus.com/birthday;
}
