# Nginx configuration for patrickadrianus.com
# Place this in your nginx sites-available directory

server {
    listen 80;
    listen [::]:80;
    server_name patrickadrianus.com www.patrickadrianus.com;
    
    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name patrickadrianus.com www.patrickadrianus.com;

    # SSL configuration (replace with your actual SSL certificate paths)
    ssl_certificate /path/to/your/certificate.crt;
    ssl_certificate_key /path/to/your/private.key;

    # Document root
    root /var/www/patrickadrianus.com/build;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private must-revalidate auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    # Handle static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Handle birthday route specifically
    location /birthday {
        try_files $uri $uri/ /index.html;
    }

    # Handle all other routes (SPA routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Handle API routes if you have any
    location /api {
        try_files $uri $uri/ =404;
    }

    # Security: deny access to hidden files
    location ~ /\. {
        deny all;
    }
}

# Birthday subdomain redirect
server {
    listen 80;
    listen [::]:80;
    server_name birthday.patrickadrianus.com;
    return 301 https://patrickadrianus.com/birthday;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name birthday.patrickadrianus.com;

    # SSL configuration (same as main domain)
    ssl_certificate /path/to/your/certificate.crt;
    ssl_certificate_key /path/to/your/private.key;

    return 301 https://patrickadrianus.com/birthday;
}
