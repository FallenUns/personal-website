# Nginx site configuration for patrickadrianus.com
# This file should be placed in /etc/nginx/sites-available/patrickadrianus.com
# Basic HTTP configuration - update SSL paths as needed

server {
    listen 80;
    listen [::]:80;
    server_name patrickadrianus.com www.patrickadrianus.com;

    # Document root - points to your deployment path
    # This matches your server structure: /var/www/html -> /var/www/current -> /var/www/releases/latest
    root /var/www/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Handle static assets with long-term caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|pdf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Handle API routes if you have any (return 404 if not found)
    location /api {
        try_files $uri $uri/ =404;
    }

    # CRITICAL: SPA routing - this handles all routes including /birthday
    # This must be the last location block
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security: deny access to hidden files
    location ~ /\. {
        deny all;
    }
    
    # Deny access to sensitive files
    location ~* \.(env|log|sql|bak)$ {
        deny all;
    }
}

# Birthday subdomain redirect (HTTP only for now)
server {
    listen 80;
    listen [::]:80;
    server_name birthday.patrickadrianus.com;
    return 301 http://patrickadrianus.com/birthday;
}
