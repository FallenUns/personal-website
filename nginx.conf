# Nginx site configuration for patrickadrianus.com
# This file should be placed in /etc/nginx/sites-available/patrickadrianus.com
# HTTPS configuration with SSL/TLS

# HTTP server - redirect all traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name patrickadrianus.com www.patrickadrianus.com;
    
    # Redirect all HTTP requests to HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS server - main configuration
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name patrickadrianus.com www.patrickadrianus.com;

    # SSL Certificate paths (Let's Encrypt with Certbot)
    ssl_certificate /etc/letsencrypt/live/patrickadrianus.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/patrickadrianus.com/privkey.pem;
    
    # SSL configuration for security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # OCSP Stapling for improved SSL performance
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/patrickadrianus.com/chain.pem;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # Document root - points to your deployment path
    # This matches your server structure: /var/www/html -> /var/www/current -> /var/www/releases/latest
    root /var/www/html;
    index index.html;

    # Request size limits for security
    client_max_body_size 1M;
    client_body_buffer_size 16K;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 1k;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=()" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    # Inline scripts are allowed by hash only. The second hash is src/theme-inline.js,
    # which sets the day/night theme before first paint; src/theme.test.ts fails the
    # build when that file changes and this line does not.
    # The Google Fonts hosts stay while the pre-rebuild site is a rollback target.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-0TbJfcwsFCrtLtXLco8jmTeVS70SUjTjtPeLtFktE08=' 'sha256-zq/ZOkYAGZ+1Ujfkw17/vIi1fidY57Jd1bePuCxMktY='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Caching uses 'expires', never 'add_header': a location with its own
    # add_header stops inheriting the security headers above.
    # Files under /assets/ and /m/ carry a content hash in their names.
    location /assets/ { expires 1y; try_files $uri =404; }
    location /m/      { expires 1y; try_files $uri =404; }
    location /fonts/  { expires 30d; try_files $uri =404; }

    # The birthday page is gone.
    location = /birthday { return 301 /; }

    # Block any json/csv being served as a static file outside /api.
    location ~* \.(json|csv)$ {
        deny all;
        return 404;
    }

    # Block accidental exposure of server-side data dirs.
    location ~ ^/(data|csv|server)/ {
        deny all;
        return 404;
    }

    # Handle API routes - proxy to backend server
    location /api {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Every address is its own HTML file: /projects/reffy -> /projects/reffy/index.html.
    # HTML is always revalidated so a deploy shows at once.
    error_page 404 /404.html;
    location / {
        expires -1;
        try_files $uri $uri/index.html @fallback;
    }

    # This config serves both builds, so a rollback needs no config change.
    # New build (has 404.html): unknown addresses answer 404 with that page.
    # Pre-rebuild build (no 404.html): unknown addresses get index.html, as its router expects.
    location @fallback {
        expires -1;
        if (-f $document_root/404.html) { return 404; }
        try_files /index.html =404;
    }

    # Security: deny access to hidden files
    location ~ /\. {
        deny all;
    }
    
    # Deny access to sensitive files
    location ~* \.(env|log|sql|bak)$ {
        deny all;
    }
}

# Birthday subdomain redirect - HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name birthday.patrickadrianus.com;
    return 301 https://patrickadrianus.com/;
}

# Birthday subdomain redirect - HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name birthday.patrickadrianus.com;
    
    # SSL Certificate (can use same cert if wildcard, or separate cert)
    ssl_certificate /etc/letsencrypt/live/patrickadrianus.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/patrickadrianus.com/privkey.pem;
    
    return 301 https://patrickadrianus.com/;
}
