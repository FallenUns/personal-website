# Nginx site configuration for patrickadrianus.com
# This file should be placed in /etc/nginx/sites-available/patrickadrianus.com
# HTTPS configuration with SSL/TLS

# HTTP server - redirect all traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name patrickadrianus.com www.patrickadrianus.com;
    
    # Redirect all HTTP requests to HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS server - main configuration
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name patrickadrianus.com www.patrickadrianus.com;

    # SSL Certificate paths (Let's Encrypt with Certbot)
    ssl_certificate /etc/letsencrypt/live/patrickadrianus.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/patrickadrianus.com/privkey.pem;
    
    # SSL configuration for security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # OCSP Stapling for improved SSL performance
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/patrickadrianus.com/chain.pem;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # Document root - points to your deployment path
    # This matches your server structure: /var/www/html -> /var/www/current -> /var/www/releases/latest
    root /var/www/html;
    index index.html;

    # Request size limits for security
    client_max_body_size 1M;
    client_body_buffer_size 16K;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 1k;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=()" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    # Current production bundle does not require string-based code execution.
    # Keep eval blocked; use nonces/hashes later if inline scripts are removed.
    # sha256 hash is for inline <script type="application/ld+json"> in index.html — regenerate if that block changes
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-0TbJfcwsFCrtLtXLco8jmTeVS70SUjTjtPeLtFktE08='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Handle static assets with long-term caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|pdf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Block any json/csv being served as a static file outside /api.
    location ~* \.(json|csv)$ {
        deny all;
        return 404;
    }

    # Block accidental exposure of server-side data dirs.
    location ~ ^/(data|csv|server)/ {
        deny all;
        return 404;
    }

    # Handle API routes - proxy to backend server
    location /api {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # CRITICAL: SPA routing - this handles all routes including /birthday
    # This must be the last location block
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security: deny access to hidden files
    location ~ /\. {
        deny all;
    }
    
    # Deny access to sensitive files
    location ~* \.(env|log|sql|bak)$ {
        deny all;
    }
}

# Birthday subdomain redirect - HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name birthday.patrickadrianus.com;
    return 301 https://patrickadrianus.com/birthday;
}

# Birthday subdomain redirect - HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name birthday.patrickadrianus.com;
    
    # SSL Certificate (can use same cert if wildcard, or separate cert)
    ssl_certificate /etc/letsencrypt/live/patrickadrianus.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/patrickadrianus.com/privkey.pem;
    
    return 301 https://patrickadrianus.com/birthday;
}
