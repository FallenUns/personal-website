name: build-and-deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Create release dirs on server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }} "\
            mkdir -p ${{ vars.DEPLOY_PATH }}/releases/${{ github.sha }}/server \
            && mkdir -p ${{ vars.DEPLOY_PATH }}/shared \
          "

      - name: Upload frontend dist
        run: |
          rsync -az --delete -e "ssh -o StrictHostKeyChecking=no" dist/ \
            ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}:${{ vars.DEPLOY_PATH }}/releases/${{ github.sha }}/

      - name: Upload backend (no sudo)
        run: |
          rsync -az -e "ssh -o StrictHostKeyChecking=no" server/ \
            ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}:${{ vars.DEPLOY_PATH }}/releases/${{ github.sha }}/server/

      - name: Upload nginx config (optional if you manage vhost separately)
        run: |
          rsync -az -e "ssh -o StrictHostKeyChecking=no" nginx.conf \
            ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}:${{ vars.DEPLOY_PATH }}/nginx.conf

      - name: Activate release and restart backend
        run: |
          ssh -o StrictHostKeyChecking=no ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }} "
            set -e

            DEPLOY_PATH='${{ vars.DEPLOY_PATH }}'
            SHA='${{ github.sha }}'

            # 1) Flip symlinks atomically
            ln -sfn \"$DEPLOY_PATH/releases/$SHA\" \"$DEPLOY_PATH/current\"
            ln -sfn \"$DEPLOY_PATH/current\" \"$DEPLOY_PATH/html\"

            # 2) Runtime data: symlink release data -> shared data (persists across deploys)
            mkdir -p /var/www/server-data/csv
            rm -rf \"$DEPLOY_PATH/current/server/data\" || true
            ln -sfn /var/www/server-data \"$DEPLOY_PATH/current/server/data\"

            # 3) Install backend deps (only if lockfile present)
            cd \"$DEPLOY_PATH/current/server\"
            if [ -f package-lock.json ]; then
              npm ci --omit=dev || npm install --omit=dev
            else
              npm install --omit=dev
            fi

            # 4) Make group 'www-data' own the code tree (no sudo chown needed; you already set membership)
            chgrp -R www-data \"$DEPLOY_PATH/current/server\" || true
            chmod -R g+rwX \"$DEPLOY_PATH/current/server\" || true
            find \"$DEPLOY_PATH/current/server\" -type d -exec chmod g+s {} \; || true

            # 5) Restart service (allowed in sudoers)
            sudo systemctl restart portfolio-server || true

            echo \"Release $SHA activated\"
          "

      - name: Purge old releases (keep last 5)
        run: |
          ssh -o StrictHostKeyChecking=no ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }} "\
            ls -1dt ${{ vars.DEPLOY_PATH }}/releases/* | tail -n +6 | xargs -r rm -rf \
          "
