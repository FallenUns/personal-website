name: build-and-deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Create release dirs on server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }} "\
            mkdir -p ${{ vars.DEPLOY_PATH }}/releases/${{ github.sha }}/server \
            && mkdir -p ${{ vars.DEPLOY_PATH }}/shared \
          "

      - name: Upload frontend dist
        run: |
          rsync -az --delete -e "ssh -o StrictHostKeyChecking=no" dist/ \
            ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}:${{ vars.DEPLOY_PATH }}/releases/${{ github.sha }}/

      - name: Upload backend (no sudo)
        run: |
          rsync -az -e "ssh -o StrictHostKeyChecking=no" server/ \
            ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}:${{ vars.DEPLOY_PATH }}/releases/${{ github.sha }}/server/

      - name: Upload nginx config (optional if you manage vhost separately)
        run: |
          rsync -az -e "ssh -o StrictHostKeyChecking=no" nginx.conf \
            ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}:${{ vars.DEPLOY_PATH }}/nginx.conf

      - name: Activate release and restart backend
        env:
          SHA: ${{ github.sha }}
        run: |
          ssh -o StrictHostKeyChecking=no ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }} <<'SSH'
            set -e
            DEPLOY_PATH="${{ vars.DEPLOY_PATH }}"
            SHA="${SHA}"

            # 1) Flip symlinks atomically
            ln -sfn "$DEPLOY_PATH/releases/$SHA" "$DEPLOY_PATH/current"
            ln -sfn "$DEPLOY_PATH/current" "$DEPLOY_PATH/html"

            # 2) Create data directory if it doesn't exist
            mkdir -p "$DEPLOY_PATH/current/server/data/csv"

            # 3) Install backend deps as deploy user
            cd "$DEPLOY_PATH/current/server"
            npm ci --omit=dev || npm install --omit=dev

            # 4) Fix permissions with sudo (but don't fail if it doesn't work)
            sudo chown -R www-data:www-data "$DEPLOY_PATH/current/server" 2>/dev/null || echo "Permission fix failed - will try alternative approach"
            
            # 5) Alternative: just make sure the data directory is writable
            sudo mkdir -p /var/www/server-data 2>/dev/null || true
            sudo chown -R www-data:www-data /var/www/server-data 2>/dev/null || true
            
            # 6) Restart service (passwordless sudo for systemctl)
            if sudo systemctl is-active --quiet portfolio-server 2>/dev/null; then
              sudo systemctl restart portfolio-server
              echo "Backend service restarted successfully"
            else
              echo "Backend service not found - run secure-env-setup.sh to create it"
            fi
            
            echo "Release $SHA activated successfully"
          SSH


      - name: Purge old releases (keep last 5)
        run: |
          ssh -o StrictHostKeyChecking=no ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }} "\
            ls -1dt ${{ vars.DEPLOY_PATH }}/releases/* | tail -n +6 | xargs -r rm -rf \
          "
